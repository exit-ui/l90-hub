<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Track the 90-day mission: daily DMs, ticks for each area, and your progress." />
    <meta name="theme-color" content="#05060a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="L90" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <title>90-day hub</title>
    <script>
      // Set the theme before the first paint, so the choice never flashes the other look. Keys match src/lib/theme.ts.
      // Nothing stored, or a wrong value, gives dark. A stored choice is kept.
      try {
        var c = localStorage.getItem('l90-hub-theme');
        var known = c === 'light' || c === 'dark' || c === 'system';
        var d = !known || c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#05060a' : '#f4f5f2');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
